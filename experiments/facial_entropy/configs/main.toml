# Main profile: targets 500 subjects (FEI provides 200: 40 calibration / 160 test) + 50-image robustness subset.
[profile]
name = "main"
synthetic_only = false
n_subjects = 500
calibration_fraction = 0.20
robustness_subset = 50
primary_pose = "11"
verification_poses = ["05", "06", "11", "12", "13", "14"]
experiments = ["exp0", "exp1", "exp2", "exp3", "exp4", "exp5", "exp6"]
run_resolution_sensitivity = true
landmark_device = "cpu"

[stats]
bootstrap = 10000
permutations = 10000
verification_bootstrap = 1000
